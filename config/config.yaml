# ============================================================
# End-to-End Automated Seismic Processing Pipeline for Earthquake Detection,
# Relocation, and Magnitude Estimation -- master configuration
#
# One section per stage script (scripts/<name>.py loads its own section by
# the same key at import time -- see each script's "2) CONFIGURATION"
# section). Keys and values are a direct port of what used to be each
# script's hardcoded CONFIG dict; nothing here changes runtime behaviour.
#
# Edit this file to change any stage's parameters -- no script needs to be
# touched for a config-only change. pipeline.py (project root) is the
# recommended way to run one or more stages after editing this file.
# ============================================================

# Display name shown by pipeline.py's banners/menu. Single source of truth
# so the two files never drift out of sync -- rename the pipeline here only.
pipeline_name: "End-to-End Automated Seismic Processing Pipeline for Earthquake Detection, Relocation, and Magnitude Estimation"

# Network code, shared by every stage. stations.txt (see stations_file below)
# holds only station/latitude/longitude/elevation_m -- the network code is
# the same for all 27 stations, so it lives here once instead of being
# repeated per station. Every script's loader injects this value into the
# per-station records it builds, so CONFIG['network'] reaches the same
# per-station dict/DataFrame shape scripts relied on when it came from
# stations.txt.
network: "3M"

# ------------------------------------------------------------
# Stage 0 -- scripts/prepro.py
# Raw AusPass channel files -> merged/detrended/resampled/bandpassed miniSEED
# ------------------------------------------------------------
preprocessing:
  # --- Main paths ---
  raw_root_dir: "/media/galih/MyBackUp 2024/AusPass_Jatim"
  output_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/preprocessing"

  # Same name/format as the prior run that produced this project's existing
  # preprocessed data -- keeping it lets a fresh run resume from that run's
  # progress instead of redoing already-finished station-days.
  checkpoint_file: "/media/galih/MyBackUp 2024/Jatim_new/output/preprocessing/checkpoint_merge_filter.json"

  network: "3M"   # AUSPASS network code, adjust if the source changes

  # Date range (inclusive). null -> auto-detect from the date folders
  # actually present under raw_root_dir (min/max), so the default adapts
  # to whatever raw data exists instead of a hard-coded window.
  start_date: null
  end_date: null

  # --- CHANNEL MERGE ---
  # This project's raw AusPass export stores each component as a separate
  # file: <date>_<STATION>_<CHANNEL>.mseed (CHE/CHN/CHZ), so true is the
  # correct default here -- files matching the same (date, station) are
  # grouped and merged into one 3-component Stream before processing.
  #
  # Set this to false only once the raw data itself already arrives
  # pre-merged (one file per station-day already containing all three
  # channels, named <date>_<STATION>.mseed with no channel suffix) -- the
  # grouping regex then matches on station alone and each "group" is just
  # that single file. The detrend/resample/bandpass steps below are
  # identical either way; this flag only changes which files get grouped
  # together during discovery.
  merge_channels: true

  # --- RESAMPLING ---
  # Source rate is the RAW data's sampling rate (AusPass Jatim miniSEED is
  # 250 Hz); target rate is what every downstream stage assumes (pick.py's
  # EQTransformer/SeisBench model, association.py's travel-time windows,
  # etc. all assume 100 Hz waveforms). 250/100 is not an integer ratio, so
  # resampling uses ObsPy's Fourier-domain resample(), not decimate().
  apply_resample: true
  source_sampling_rate: 250.0   # Hz -- informational/for the anti-alias corner; the
                                 # actual per-trace rate is always read from the
                                 # miniSEED header, this value is not enforced
  target_sampling_rate: 100.0   # Hz -- resample() target

  apply_antialias_lowpass: true
  antialias_lowpass_freq: 40.0  # Hz -- low-pass corner applied BEFORE resample,
                                 # must stay below the target Nyquist (100/2 = 50 Hz);
                                 # a 40 Hz corner leaves a 10 Hz safety margin

  # --- DETREND / DEMEAN ---
  # Both are applied twice, matching the reference workflow: once before
  # resampling (removes the raw trend/DC offset so it doesn't distort the
  # anti-alias filter or the resample), and once after (resampling can
  # reintroduce a small residual trend/offset), right before the bandpass.
  apply_detrend: true   # ObsPy detrend('linear') -- removes a linear drift/trend
  apply_demean: true    # ObsPy detrend('demean')  -- removes the DC offset (mean)

  # --- BANDPASS FILTER ---
  # 1-10 Hz covers typical local-earthquake P/S energy for this network's
  # station spacing (tens to low hundreds of km) while rejecting long-period
  # microseismic noise below 1 Hz and high-frequency instrument/cultural
  # noise above 10 Hz.
  apply_bandpass: true
  bandpass_freqmin: 1.0    # Hz
  bandpass_freqmax: 10.0   # Hz
  bandpass_corners: 4
  bandpass_zerophase: true   # zero-phase (forward+backward) -- no phase-arrival time shift

  apply_taper: true   # taper before the bandpass filter, avoids edge
                       # transients ("ringing") at the start/end of each trace
  taper_max_percentage: 0.05
  taper_type: "hann"

  # --- Output encoding ---
  output_dtype: "int32"    # miniSEED STEIM2 requires integer samples
  output_encoding: "STEIM2"
  output_record_length: 4096

  # --- Parallel processing ---
  max_workers: null   # null -> os.cpu_count()
  checkpoint_save_every: 20   # flush checkpoint to disk every N finished groups
                               # (batched, so I/O isn't a bottleneck under parallel runs)

  # --- Debugging ---
  debug_max_groups: null   # int -> process only the first N groups (smoke-testing)


# ------------------------------------------------------------
# Stage 1 -- scripts/pick.py
# EQTransformer (SeisBench) P/S phase picking
# ------------------------------------------------------------
picking:
  # --- Main paths ---
  input_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/preprocessing"
  output_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/picking"
  stations_file: "/media/galih/MyBackUp 2024/Jatim_new/stations.txt"

  # --- Checkpoint (process resume) ---
  checkpoint_file: "/media/galih/MyBackUp 2024/Jatim_new/output/picking/checkpoint.json"

  # --- Combined CSV (appended per file, resumable) ---
  # Final path: <output_folder>/summary/<combined_csv_name>
  combined_csv_name: "ALL_results_combined.csv"

  # --- Model ---
  model_name: "stead"

  # --- Compute performance (CPU/GPU) ---
  batch_size: 64    # batch size for model annotate()/classify() (SeisBench default: 256)
  num_threads: 8    # CPU threads for torch (torch.set_num_threads); null uses the system default
  parallelism: 1    # >1 -> multiprocessing across files in SeisBench annotate/classify (multi-core CPU only)

  # --- Thresholds ---
  P_threshold: 0.01
  S_threshold: 0.01
  detection_threshold: 0.01
  overlap: 0.3

  # --- Quality filters ---
  min_peak_value: 0.1     # minimum detection_probability for a row to count as an event
  require_p_and_s: true   # true -> an event MUST have both P and S (neither NaN);
                           #         rows with only one (or neither) are discarded

  # --- Stage logging (diagnostics: read file / merge / annotate / classify / plot) ---
  verbose_timing: true    # true -> print per-stage duration for each file (useful on long runs)

  # --- Time gap guard ---
  # If a file contains an inter-segment gap larger than this (seconds), the file is
  # SKIPPED rather than force-interpolated. This prevents ObsPy from attempting a
  # huge array allocation on corrupt timestamps or extreme gaps, which can drive the
  # system into thrashing/swap (appears to "hang" at 0% CPU).
  # Set to null to disable this check.
  max_gap_seconds: 3600   # 1 hour; raise it if larger gaps are normal for your data

  # --- Plot settings ---
  plot_overview: true
  plot_per_event: true
  plot_summary: true
  max_event_plots: 50
  plot_dpi: 150
  plot_format: "png"

  # --- File / folder patterns ---
  day_folder_pattern: "*"        # per-day folder name pattern inside input_folder
  file_pattern: "*.mseed"        # mseed file name pattern inside each day folder


# ------------------------------------------------------------
# Stage 2 -- scripts/association.py
# PyOcto phase association + QC-0..QC-4 + per-event plots
# ------------------------------------------------------------
association:
  # --- Main paths ---
  picks_csv: "/media/galih/MyBackUp 2024/Jatim_new/output/picking/summary/ALL_results_combined.csv"
  stations_file: "/media/galih/MyBackUp 2024/Jatim_new/stations.txt"
  waveform_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/preprocessing"
  output_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/association"

  # --- Checkpoint: the ONLY progress tracker ---
  # Holds two lists:
  #   associated_days : dates whose association has completed
  #   plotted_events  : events whose plots have been produced
  # Each day's association output is appended to csv/pyocto_events.csv and
  # csv/pyocto_assignments.csv, then the date is recorded -- so an interrupted
  # run resumes from the next day.
  #
  # Delete this file (or start without one) -> EVERYTHING restarts from zero:
  # the stale association CSVs are removed and all days are re-associated.
  checkpoint_file: "/media/galih/MyBackUp 2024/Jatim_new/output/association/checkpoint.json"

  # --- PICK FILTERING (before the associator) ---
  #
  # No filtering on EQTransformer probability, by design. Picking was run with
  # the SeisBench 'stead' model at a threshold of 0.01, so the probability value
  # does not discriminate earthquake from non-earthquake. Confirmed empirically:
  # raising a probability cut from 0.05 to 0.30 removes 5x the picks while the
  # associated event count stays unchanged.
  #
  # Filtering is instead applied in layers by:
  #   1. the associator (space-time consistency)
  #   2. QC-0..QC-4 (geometry, Ts-Tp, origin time, agreement with the location)
  #   3. the per-event waveform plot -> visual inspection, the final arbiter of
  #      whether an event is real
  #
  # SNR filter (null -> disabled). Unlike probability, SNR measures signal
  # strength against noise and therefore carries physical meaning.
  min_p_snr: null
  min_s_snr: null

  # --- VELOCITY MODEL (assumed) ---
  vp: 6.0            # assumed Vp (km/s)
  vpvs_ratio: 1.73    # Vs = vp / vpvs_ratio

  # --- GEOMETRY: ALL VALUES DERIVED AUTOMATICALLY FROM stations.txt ---
  #
  # Every parameter in this block is null -> computed from the station layout
  # (see derive_network_geometry), so the pipeline adapts itself to a different
  # dataset or network. Set an explicit number ONLY to override the automatic
  # value.
  #
  # Base quantities:
  #   APERTURE  = largest inter-station distance (km)
  #   CUTOFF    = ceil(APERTURE * cutoff_factor)
  #   Z_MAX     = clip(round(zmax_factor * APERTURE), zmax_min_km, zmax_max_km)
  #   R_MAX     = sqrt(CUTOFF^2 + Z_MAX^2)   (largest hypocentral distance)
  #   K_PSEUDO  = Vp*Vs/(Vp-Vs)              (km/s; pseudo-distance factor)
  association_cutoff_km: null   # auto: ceil(APERTURE * cutoff_factor)
  cutoff_factor: 1.2

  zlim_km: null            # auto: (Z_MIN, Z_MAX); Z_MIN from station elevation
  zmin_margin_km: 0.05      # clearance kept above the highest station
  zmax_factor: 0.7          # depth is unresolved far beyond the aperture
  zmax_min_km: 30.0
  zmax_max_km: 200.0

  # Padding beyond the station bounding box, per direction (N/S/E/W). Auto
  # derivation walks outward from each box edge until fewer than
  # n_p_and_s_picks stations remain within association_cutoff_km of the
  # point -- the same eligibility rule PyOcto itself applies -- so the
  # search box is exactly as large as PyOcto could ever usefully search,
  # capped at area_padding_cap_km (default: APERTURE, one network diameter;
  # beyond that the azimuthal coverage is too poor for a meaningful
  # location, same rationale as zmax_factor).
  area_padding_deg: null      # auto: see derive_area_padding_km(); set to
                               # override with a single symmetric value
  area_padding_cap_km: null   # auto: APERTURE
  area_padding_step_km: 1.0    # search resolution (km) for the walk-outward

  time_before: null           # auto: R_MAX / Vs * time_before_factor
  time_before_factor: 1.5      # margin: the origin may precede the first pick

  # velocity_tolerance is the allowance (seconds) between the observed arrival
  # time and the one predicted by the velocity model. Picks outside this budget
  # are IGNORED by the associator, which can push an event below
  # n_p_and_s_picks and discard it entirely even when the earthquake is real.
  #
  # Rationale: association uses a single homogeneous Vp while the Earth is
  # layered (crust ~5.8, mantle ~8.04 km/s in the model used by NonLinLoc).
  # That velocity difference produces a travel-time error proportional to path
  # length, so the tolerance is scaled to the longest P travel time:
  #     tolerance = velocity_tolerance_factor * (R_MAX / Vp)
  # A factor of 0.10 represents a ~10% effective velocity error along the path,
  # chosen deliberately LOOSE so that as few real events as possible are lost
  # during association. Filtering is left to QC-0..QC-4 and, as the final
  # arbiter, visual inspection of the per-event waveform plot.
  #
  # Empirical calibration on this dataset (5-day subset, 7,314 picks):
  #     tol 2.0s -> 1 event (0.7s)    tol 5.0s -> 2 events ( 16.4s)
  #     tol 3.0s -> 2 events (2.5s)   tol 6.0s -> 2 events ( 35.4s)  <- safe ceiling
  #     tol 4.0s -> 2 events (7.1s)   tol 8.0s -> 1 event  (114.5s)  <- degraded
  #
  # The yield curve is humped, so "looser is always better" does NOT hold:
  #   too tight -> distant stations are dropped and the event fails the 3-pair
  #                requirement
  #   too loose -> noise picks look compatible, spurious trial locations beat
  #                the correct one, and runtime explodes
  # velocity_tolerance_max is therefore pinned at 6.0 s: the largest value
  # verified not to reduce yield.
  velocity_tolerance: null   # auto: velocity_tolerance_factor * (R_MAX / Vp)
  velocity_tolerance_factor: 0.10
  velocity_tolerance_min: 1.0
  velocity_tolerance_max: 6.0

  # --- SEARCH VOLUME HANDOFF TO THE LOCATION STAGE ---
  #
  # The association search volume is written to
  #   <output_folder>/nonlinloc/search_volume.json
  # and read by locator.py, which turns it into the NonLinLoc LOCGRID.
  #
  # Both stages therefore search exactly the same volume, derived from the
  # station distribution alone. Nothing is hard-coded from an external control
  # file, so no event can be associated in a region the locator cannot reach.
  #
  # The projection origin is the station centroid, which keeps the flat-earth
  # SIMPLE transform most accurate near the centre of the network.
  write_search_volume: true
  locgrid_node_spacing_km: 0.5   # LOCGRID cell size used by locator.py

  # --- ASSOCIATOR PARAMETERS (PyOcto) ---
  n_picks: 6            # minimum total picks required to form an event
  n_p_and_s_picks: 3     # minimum stations having both a P and an S pick
  n_threads: null         # null -> use os.cpu_count()

  # Association always runs one UTC day at a time, for two reasons:
  #   1. batch boundaries fall at midnight, so no event is split (events last
  #      seconds to minutes, far shorter than a day)
  #   2. the date becomes a resumable checkpoint unit

  # --- QUALITY CONTROL PARAMETERS ---
  # Two distance definitions are computed for EVERY (event, station):
  #   'ts_tp'      -> d = (Vp*Vs/(Vp-Vs)) * (Ts-Tp)
  #                   Estimated PURELY FROM THE PICKS, independent of the location.
  #   'hypocenter' -> d = sqrt(epicentral_distance^2 + depth^2) from the catalogue.
  #                   The true hypocentral distance implied by the association.
  #
  # They serve different purposes, and keeping them separate is deliberate:
  #
  #   dist_method_qc2  -> 'ts_tp'. QC-2 tests whether the distance difference
  #       between two stations is plausible against their physical separation.
  #       The test is only meaningful with pick-derived distances; distances
  #       derived from a single hypocentre automatically satisfy the triangle
  #       inequality, so QC-2 would never reject anything.
  #
  #   dist_method_plot -> 'hypocenter'. The x-axis of the pseudo-distance plot
  #       and the basis of the QC-3 fit. With 'ts_tp' this plot is merely the
  #       Wadati diagram with swapped axes (identical R^2), making the two QC-3
  #       checks redundant. With 'hypocenter' it tests the picks against the
  #       LOCATION while Wadati tests the Vp/Vs ratio -- two independent checks,
  #       as QC-3 was originally intended.
  dist_method_qc2: "ts_tp"
  dist_method_plot: "hypocenter"

  run_qc0: true    # dedup double picks + require both P and S
  run_qc1: true    # Ts-Tp bounds
  run_qc2: true    # inter-station geometry consistency
  run_qc3: true    # non-physical fit slope
  run_qc4: true    # inter-station origin-time consistency

  double_pick_window_sec: 2.0    # QC-0a: time separation treated as a duplicate pick

  # QC-0c: minimum number of DISTINCT stations having a complete P and S pair.
  # The associator already guarantees this via n_p_and_s_picks, but the QC-0a
  # dedup can reduce the count -- so the requirement is re-enforced here.
  min_ps_pairs: 3

  # QC-1: maximum Ts-Tp (seconds).
  # null -> auto = reference_distance / K_PSEUDO, where K_PSEUDO = Vp*Vs/(Vp-Vs).
  # This is why QC-1 adapts when the network or the velocity model changes.
  max_ts_tp_sec: null
  max_ts_tp_reference: "aperture"   # 'aperture' -> use APERTURE (stricter,
                                     #   the event must fit inside the network)
                                     # 'search_volume' -> use R_MAX (looser,
                                     #   allows events at the edge of the search area)
  min_ts_tp_sec: 0.0    # QC-1: Ts-Tp must exceed this value

  # ---- QC-2: inter-station geometry test (triangle inequality) ----
  # For every station pair (A,B) that picked the same event:
  #     |d_A - d_B|  must be  <=  D_AB   (D_AB = true inter-station distance)
  # A violation means the geometry is impossible, so it cannot be one event.
  #
  # 'physical' (recommended): tested in KILOMETRES with a pick-error tolerance,
  #     violated when  |d_A - d_B| - D_AB  >  qc2_n_sigma * sigma_d
  #     sigma_d = K_PSEUDO * 2 * qc2_pick_sigma_sec  (pick-error propagation)
  #     The threshold is physical: it rejects nothing when the data are clean
  #     and does not unfairly penalise closely spaced station pairs.
  #
  # 'percentile' (legacy behaviour): ratio |d_A-d_B|/D_AB with a threshold taken
  #     from the percentile of the distribution over all events. Note this
  #     ALWAYS discards ~5% of events regardless of data quality, and
  #     disproportionately penalises well-recorded events (more stations means
  #     more pairs, hence a higher chance one exceeds the percentile).
  qc2_method: "physical"
  qc2_pick_sigma_sec: 0.3    # uncertainty of an individual pick (seconds)
  qc2_n_sigma: 3.0            # sigma multiplier used as the tolerance
  qc2_percentile: 95          # only used when qc2_method='percentile'
  qc2_threshold_ratio: null   # set 1.0 for the pure geometric bound

  # ---- QC-4: inter-station origin-time consistency ----
  # Each station with a P-S pair computes its own origin time:
  #     OT_i = Tp_i - (Ts_i - Tp_i) / (Vp/Vs - 1)
  # Absolute Vp cancels out -- only the Vp/Vs ratio matters -- so this test is
  # insensitive to the crudeness of the homogeneous Vp assumption.
  #
  # If every station recorded the SAME event, all OT_i must agree. A station
  # that actually recorded a different event deviates by the origin-time
  # separation of the two events. QC-2 cannot detect this case, because two
  # distinct events can still produce a geometrically plausible distance set.
  qc4_abs_tol_sec: 2.0    # maximum OT deviation (absolute safety net)
  qc4_n_mad: 3.0            # adaptive threshold: n * 1.4826 * MAD
  # 'drop_event'   -> one deviating station discards the whole event (conservative)
  # 'drop_station' -> drop only that station; the P-S pair count is recomputed
  #                   and QC-0c (min_ps_pairs) re-enforced, so the 3-pair
  #                   minimum can never be violated
  qc4_action: "drop_event"

  # ---- QC-3: physical plausibility of the per-event fits ----
  # Two fits per event:
  #   travel-time : tp          = slope * distance + intercept  -> Vp = 1/slope
  #   Wadati      : delta_ts_tp = slope * tp       + intercept  -> Vp/Vs = slope + 1
  #
  # Only the slope is tested. The intercept criterion is disabled because tp is
  # measured relative to the PyOcto origin time: if that origin is late by d
  # seconds, the Wadati intercept shifts by roughly -(Vp/Vs - 1) * d. For events
  # with few stations and a large azimuthal gap, an error of 1-3 s is normal, so
  # a slightly negative intercept measures origin-time precision rather than
  # pick quality.
  #
  # slope <= 0 is still rejected because it is physically impossible:
  #   travel-time fit -> arrival time decreasing with distance
  #   Wadati fit      -> Vs > Vp
  #
  # The three parameters below may be set to null to disable their criterion.
  qc3_intercept_tol_sec: null   # null -> the intercept is not tested at all
  qc3_vp_range: null            # e.g. [4.0, 8.5] -> bound the apparent Vp (km/s)
  qc3_vpvs_range: null          # e.g. [1.5, 2.0] -> bound Vp/Vs

  vpvs_ref: null   # QC-3 and Wadati plot: null -> follow vpvs_ratio

  # --- PER-EVENT PLOT SETTINGS ---
  plot_pseudo_distance: true    # per-event pseudo-distance plot
  plot_wadati: true             # per-event Wadati diagram
  plot_waveform: true           # per-event waveform with P/S picks
  plot_rejected_events: true    # also plot QC-rejected events (rejected/ folder)
  save_event_picks_csv: true    # write the per-event pick table into the event folder

  max_events_plot: 0     # 0 -> all events; >0 -> limit (for trial runs)
  plot_dpi: 120
  plot_format: "png"

  # --- PER-EVENT WAVEFORM PLOT SETTINGS ---
  wf_pad_before_p: 5     # seconds before the first P pick
  wf_pad_after_s: 20      # seconds after the last S pick
  wf_fallback_pre: 5      # no picks available: seconds before the origin
  wf_fallback_post: 60    # no picks available: seconds after the origin
  wf_max_stations: 12     # maximum station panels per figure (nearest stations)
  wf_panel_height: 2.6    # height (inches) of each station panel
  wf_channel_priority: ["CHZ", "HHZ", "BHZ", "EHZ", "SHZ"]

  # Waveform file patterns inside <waveform_folder>/<YYYY-MM-DD>/
  # {sta} and {date} are substituted. Tried in order until one matches.
  wf_file_patterns:
    - "*.{sta}..{date}.mseed"
    - "*.{sta}.*.{date}.mseed"
    - "*{sta}*{date}*.mseed"

  # --- CROSS-EVENT SUMMARY OUTPUT ---
  # event_summary.csv : one row per event (position, time, contributing stations,
  #                     P-S pair count, azimuthal gap, fit metrics)
  # phase_picks.csv   : one row per pick (event, station, phase, absolute time,
  #                     travel time, distance, azimuth) -- ready for relocation
  write_event_summary: true
  summary_include_rejected: false   # true -> also write REJECTED events (status column)

  # --- NONLINLOC OUTPUT ---
  # Writes NLLOC_OBS phase observation files plus a GTSRCE block for the
  # NonLinLoc control file, so hypocentre location can be run directly.
  write_nonlinloc: true

  # One .pick file per event following the existing convention: filename
  # YYYYMMDD-HHMM-SS.pick, components ChZ (P) and ChN (S). Matches
  # LOCFILES <dir>/*.pick NLLOC_OBS directly.
  nll_write_pick_files: true
  nll_pick_component_p: "ChZ"
  nll_pick_component_s: "ChN"

  # Combined .obs archive (all events, separated by blank lines)
  nll_write_combined_obs: true
  nll_obs_priorwt: true   # PRIORWT column = pick probability (.obs only)

  nll_error_p_sec: 0.10    # P pick uncertainty (GAU, seconds)
  nll_error_s_sec: 0.20    # S pick uncertainty (normally larger than P)
  nll_include_rejected: false   # do not send QC-rejected events to NonLinLoc

  # --- GLOBAL SUMMARY PLOTS ---
  plot_summary: true
  # Wadati and pseudo-distance diagrams POOLED over all events (not per event).
  # QC-passing events are coloured, rejected ones grey -- this shows whether QC
  # actually separates two populations.
  plot_summary_wadati: true
  plot_summary_pseudo: true

  # --- Stage logging ---
  verbose_timing: true


# ------------------------------------------------------------
# Stage 3 -- scripts/locator.py
# NonLinLoc hypocentre location (Vel2Grid -> Grid2Time -> NLLoc)
# ------------------------------------------------------------
hypocenter_locator:
  # --- Main paths ---
  # Directory holding the NonLinLoc executables (Vel2Grid, Grid2Time, NLLoc).
  nll_bin_dir: "/home/galih/NLLoc/src"

  # Output of association.py. Both the per-event .pick files and the search
  # volume handed over by that stage live under this directory, so the two
  # stages connect with no manual step in between.
  association_nll_dir: "/media/galih/MyBackUp 2024/Jatim_new/output/association/nonlinloc"

  stations_file: "/media/galih/MyBackUp 2024/Jatim_new/stations.txt"
  output_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/hypocenter_locator"

  # --- Checkpoint: the only progress tracker ---
  # Holds which travel-time grids were built and which events were located.
  # Delete the file to force everything to be rebuilt from scratch.
  checkpoint_file: "/media/galih/MyBackUp 2024/Jatim_new/output/hypocenter_locator/checkpoint.json"

  # Travel-time grids are expensive to build but reusable across runs.
  # true -> delete and rebuild them even if they already exist.
  rebuild_grids: false

  # --- Search grid and coordinate transformation ---
  #
  # Neither is configured by hand. Both are read from
  #   <association_nll_dir>/search_volume.json
  # which association.py derives from the station distribution: the projection
  # origin is the station centroid, and the grid spans exactly the volume that
  # association searched. The two stages therefore cover the same region by
  # construction, and no event can be associated somewhere the locator cannot
  # reach.
  #
  # Set an explicit value below only to override the handed-over definition.
  grid_override: null   # e.g. {grid_x_num: 701, ...} to force a grid

  # --- 1D layered velocity model ---
  # Single source of truth: config/vel_model/jatim_velocity_model.txt
  # (NLLoc LAYER format). locator.py parses it into CONFIG['velocity_model']
  # (a list of (depth_top_km, Vp_km_s, Vs_km_s, density) tuples) at load time.
  velocity_model_file: "/media/galih/MyBackUp 2024/Jatim_new/config/vel_model/jatim_velocity_model.txt"

  # --- Travel-time grid generation ---
  #
  # Always GRID2D. A 1D layered model makes travel time depend only on
  # horizontal distance and depth, never on azimuth, so Grid2Time stores a 2D
  # (distance, depth) grid per station instead of a full 3D volume and NLLoc
  # interpolates at lookup time. The travel times are identical while the
  # storage differs by orders of magnitude: roughly 0.25 GB here versus about
  # 56 GB for the equivalent GRID3D set.
  #
  # GRID3D would only be justified by a genuinely 3D velocity model, which the
  # LAYER statement cannot express.
  compute_angles: true   # ANGLES_YES -> take-off angles, needed for focal mechanisms

  # The 2D grid must reach from each station to the farthest corner of LOCGRID.
  # null -> derived automatically from the station layout and the search grid.
  vg2d_distance_km: null
  vg2d_margin_km: 10.0   # safety margin added to the derived distance

  # Build explicit S travel-time grids.
  # true  -> S times come from the layered Vs profile (LOCMETH VpVs is disabled).
  #          More accurate, since Vp/Vs varies with depth in the model above.
  # false -> only P grids are built and S times are scaled from P by
  #          loc_vpvs_ratio. Halves the grid build time and storage.
  use_s_grids: true
  loc_vpvs_ratio: 1.74   # only used when use_s_grids is false

  # --- NLLoc location parameters ---
  # EDT_OT_WT is robust to outlier arrivals, which matters because association
  # picks are automatic. The octree search is far cheaper than a full grid
  # search at equivalent resolution.
  loc_method: "EDT_OT_WT"
  loc_max_dist_sta: 9999.0   # maximum station-to-grid distance to use (km)
  loc_min_phases: 6           # minimum arrivals required to attempt a location
  loc_max_phases: -1          # -1 -> no limit
  loc_min_s_phases: -1        # -1 -> no minimum on S count
  loc_max_3d_mem: 6
  loc_min_dist_sta: -1.0
  loc_reject_dup: 1           # reject duplicate arrivals on the same station/phase

  loc_search: "OCT 50 50 10 0.01 50000 5000 0 1"
  loc_gau: "0.2 0.0"                 # LOCGAU  sigma_time(s) corr_len(km)
  loc_gau2: "0.01 0.05 2.0"          # LOCGAU2 fraction, min(s), max(s)
  loc_qual2err: "0.1 0.5 1.0 2.0 99999.9"
  loc_hypout: "SAVE_NLLOC_ALL SAVE_NLLOC_SUM"
  loc_signature: "Jatim network -- EQTransformer + PyOcto + NonLinLoc"
  loc_comment: "Automated hypocentre location"

  # --- Quality control on the located catalogue ---
  #
  # An event is kept as high quality only if it satisfies ALL five criteria
  # simultaneously:
  #     rms <= rms_threshold          travel-time residual (s)
  #     err_h <= median(err_h)        horizontal uncertainty (km)
  #     err_z <= median(err_z)        vertical uncertainty (km)
  #     gap <= median(gap)            azimuthal gap (deg)
  #     pdf_volume <= median(...)     confidence-volume of the location PDF (km^3)
  #
  # Four of the thresholds are the median of the catalogue itself, so they
  # adapt to the dataset rather than being imposed on it: an event is kept when
  # it is better than typical on every metric at once. Because the criteria are
  # combined with AND, the survivor fraction is far below 50%.
  #
  # The RMS threshold is instead absolute and comes from the recording itself:
  # a pick cannot be more precise than the sample interval, so the smallest
  # meaningful residual is a few samples. rms_n_samples / sampling_rate gives
  # 4 / 100 Hz = 0.04 s for this dataset.
  #
  # run_qc = false keeps every located event and only labels them.
  run_qc: false
  qc_sampling_rate: null    # Hz; null -> read from the waveform data
  qc_rms_n_samples: 4        # RMS threshold = n_samples / sampling_rate
  qc_metrics: ["rms_s", "err_h_km", "err_z_km", "azimuthal_gap", "pdf_volume_km3"]
  # Metrics whose threshold is the catalogue median; anything not listed keeps
  # the absolute threshold defined above.
  qc_median_metrics: ["err_h_km", "err_z_km", "azimuthal_gap", "pdf_volume_km3"]

  # Used only to read the sampling rate when qc_sampling_rate is null.
  waveform_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/preprocessing"

  # --- Plot settings ---
  plot_summary: true
  plot_dpi: 150
  plot_format: "png"

  # Aesthetic hypocentre distribution map rendered with PyGMT (coastline
  # basemap, station/event overlay). Independent of plot_summary's matplotlib
  # panels -- skipped automatically if pygmt is not installed.
  #
  # No relief shading: pygmt.datasets.load_earth_relief() needs to reach
  # GMT's remote tile servers (oceania/europe.generic-mapping-tools.org),
  # which time out on this network -- confirmed both from the machine
  # running this pipeline and independently. fig.coast()'s land/water fill
  # needs no such download, so it is used instead.
  plot_pygmt_map: true
  pygmt_region_padding_deg: 0.3   # margin added around stations+events bbox
  pygmt_map_width: "15c"
  pygmt_dpi: 300

  # --- Stage logging ---
  verbose_timing: true
  binary_log_lines: 6   # tail lines kept from each binary's stdout


# ------------------------------------------------------------
# Stage 4 -- scripts/relocation.py
# Double-difference relocation (hypoDD, via relocDD-py)
# ------------------------------------------------------------
relocation:
  # --- Main paths ---
  catalog_csv: "/media/galih/MyBackUp 2024/Jatim_new/output/hypocenter_locator/csv/hypocenter_catalog.csv"
  phases_csv: "/media/galih/MyBackUp 2024/Jatim_new/output/hypocenter_locator/csv/hypocenter_phases.csv"
  stations_file: "/media/galih/MyBackUp 2024/Jatim_new/stations.txt"
  waveform_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/preprocessing"
  output_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/relocation"
  relocdd_py_dir: "/media/galih/MyBackUp 2024/Jatim_new/output/relocation/relocDD-py"

  # Only relocate events that passed locator.py's QC (qc_pass column).
  # If locator.py ran with run_qc=false, every event is qc_pass=true and
  # this has no effect.
  use_qc_pass_only: true

  # --- 1D velocity model (shared with hypocenter_locator/locator.py) ---
  #
  # hypoDD needs a single constant Vp/Vs ratio (unlike NLLoc's per-layer
  # Vs profile), so 1.73 is used here -- the same value association.py
  # assumes and that the pooled Wadati fit on the associated catalogue
  # recovers empirically (see CLAUDE.md). The P velocity/depth layers are
  # parsed from the same config/vel_model/jatim_velocity_model.txt used by
  # locator.py, so both stages search with the same physical model.
  vpvs_ratio: 1.73
  velocity_model_file: "/media/galih/MyBackUp 2024/Jatim_new/config/vel_model/jatim_velocity_model.txt"

  # --- MAXSEPE: max hypocentral separation for event pairing ---
  #
  # This is the single most consequential parameter here, in the same way
  # velocity_tolerance is for association.py: it sets which event pairs are
  # allowed to link at all, both for cross-correlation (dt.cc) and for
  # ph2dt's own catalogue pairing (dt.ct). Too tight and real neighbouring
  # events never link; too loose and events that are not physically close
  # get paired, diluting the double-difference constraint with pairs whose
  # travel-time-difference assumption (paths through the same medium) no
  # longer holds.
  #
  # Auto rule (matches the validated derivation from the reference project,
  # jatim_aus/relokasi/cek_input.ipynb): for every event, find the distance
  # to its 3rd-nearest neighbour (3D, Haversine + depth) -- more robust
  # than the 1st-nearest neighbour, which is thrown off by isolated
  # singletons -- then take the MEDIAN of that distribution across the
  # catalogue. This value is small enough to keep pairs within a genuinely
  # local cluster, and large enough that every event has at least a few
  # neighbours to pair with. (On jatim_aus's 205-event catalogue this gave
  # 16.25 km, used as MAXSEPE=16.2 in production.)
  #
  # Set an explicit km value to override the auto rule.
  maxsepe_km: null    # null -> auto (median of 3rd-NN 3D distance)
  maxsepe_nn_k: 3       # which nearest-neighbour rank to use

  # Station-pair max separation (MAXSEPS in ph2dt.inp). Only used by the
  # station-pair (SDD) method; this pipeline runs event-pair (EDD), so it
  # is inert here but ph2dt.inp still requires a value.
  maxseps_km: 5.0

  # --- Cross-correlation (dt.cc) ---
  cc_lowcut_hz: 0.1
  cc_highcut_hz: 10.0
  cc_target_sr_hz: 100.0
  cc_channel_priority: ["CHZ", "HHZ", "BHZ", "EHZ", "SHZ"]
  cc_wf_file_patterns:
    - "*.{sta}..{date}.mseed"
    - "*.{sta}.*.{date}.mseed"
    - "*{sta}*{date}*.mseed"

  # Window cut around each catalogue pick, per phase (seconds).
  cc_p_pre_s: 1.0
  cc_p_post_s: 4.0
  cc_s_pre_s: 1.0
  cc_s_post_s: 6.0

  # Only station/phase pairs with |CC| >= threshold are written to dt.cc.
  cc_threshold: 0.3

  # Diagnostic waveform+NCC figures for the N highest-mean-|CC| pairs.
  cc_max_plot: 15

  # --- ph2dt.inp (event-pair differential-time preprocessing) ---
  ph2dt_minwght: 0.0     # min pick weight kept
  ph2dt_maxdist_km: 500.0   # max event-to-station distance
  ph2dt_maxngh: 30        # max neighbours per event
  ph2dt_minlnk: 3         # min shared links to call two events neighbours
  ph2dt_minobs: 3         # min observations per pair kept
  ph2dt_maxobs: 50        # max observations per pair kept

  # --- hypoDD.inp (relocation) ---
  hyp_idat: 3     # 3 = cross-correlation + catalogue
  hyp_ipha: 3     # 3 = P & S
  hyp_dist_km: 250.0   # max cluster-centroid to station distance
  hyp_obscc: 0     # min obs/pair for CC data (0 = no extra clustering)
  hyp_obsct: 0     # min obs/pair for catalogue data
  # 2 = start from each event's own NLLoc catalogue location (matches the
  # validated jatim_aus run). 1 = start every event at the cluster centroid
  # instead -- relocDD-py's fallback path for istart=1 (hypoDD_functions.py
  # trialsrc(), the 'except' branch reached whenever no origXY.loc file is
  # present) references src_xi/src_yi/src_zi before they are ever
  # allocated and always crashes with UnboundLocalError, so istart=1 is not
  # usable with this relocDD-py version regardless.
  hyp_istart: 2
  hyp_isolv: 2     # 2 = LSQR (iterative; SVD only viable for tiny sets)
  # Three-stage reweighting schedule, from loose/stable to tight/precise. The
  # WTCTP/WTCTS/WRCT/WDCT (catalogue-side) values are unchanged from the
  # validated jatim_aus run (see WORKFLOW_MATCHING_TO_HYPODDD.md); WTCCP/
  # WTCCS/WRCC/WDCC (CC-side) are set here to actually weight dt.cc in the
  # inversion -- the reference run left WTCCP=WTCCS=0 (dt.cc built only for
  # the repeater-detection figures, never fed into hypoDD itself), but this
  # pipeline exists specifically to use the correlation as a constraint.
  # WRCC/WDCC are left disabled (-9) because CC pairs are already gated
  # once by |CC|>=cc_threshold at dt.cc-build time and again by MAXSEPE at
  # pairing time, so a second residual/distance cutoff here would be
  # redundant. WTCCS tightens across stages the same way WTCTS does, since
  # S picks (catalogue or CC-derived) are inherently less precise than P.
  #   NITER WTCCP WTCCS WRCC WDCC WTCTP WTCTS WRCT WDCT
  hyp_iter_blocks:
    - [3, 1.0, 0.25, -9.0, -9.0, 1.0, 0.25, 0.40, 15.0]
    - [6, 1.0, 0.20, -9.0, -9.0, 1.0, 0.20, 0.25, 12.0]
    - [9, 1.0, 0.15, -9.0, -9.0, 1.0, 0.15, 0.15, 10.0]
  hyp_damp: 60.0   # DAMP column shared by every iteration block

  # --- run.inp (relocDD-py driver) ---
  reloctype: 1    # 1 = EDD (event-pair, classic hypoDD)
  stdcc: 0.001
  stdct: 0.01

  # --- Plot settings ---
  plot_dpi: 150
  plot_format: "png"


# ------------------------------------------------------------
# Stage 5 -- scripts/magnitud.py
# Local magnitude (Wood-Anderson amplitude, Hutton & Boore ML) + event/magnitude map
# ------------------------------------------------------------
magnitud:
  # --- Main paths ---
  reloc_summary_csv: "/media/galih/MyBackUp 2024/Jatim_new/output/relocation/hypocenter_relocated_summary.csv"
  phase_dat: "/media/galih/MyBackUp 2024/Jatim_new/output/relocation/phase.dat"
  stations_file: "/media/galih/MyBackUp 2024/Jatim_new/stations.txt"
  waveform_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/preprocessing"
  output_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/magnitud"

  # Cached StationXML responses (fetched once, then reused). Seeded from the
  # prior jatim_aus study for stations sharing the same network/instruments;
  # any station missing here is fetched from AUSPASS_FDSN_URL on first use.
  xml_cache_dir: "/media/galih/MyBackUp 2024/Jatim_new/output/magnitud/StationXML_3M"

  network: "3M"
  auspass_fdsn_url: "http://auspass.edu.au"
  channel_pattern: "CH?"
  horizontal_channels: ["CHN", "CHE"]

  # --- Event/station selection ---
  # Only relocated events (hypocenter_relocated_summary.csv) are processed --
  # events that failed relocation have no usable origin for a hypocentral
  # distance. A station magnitude requires a P+S pair by default; set to
  # false to also accept P-only windows (less reliable amplitude timing).
  require_s_pick: true
  max_events: null   # int -> process only the first N events (debugging)

  # --- Amplitude measurement windows (seconds, relative to the S or P pick) ---
  amp_pre_s: 0.5
  amp_after_s: 6.0
  amp_after_p_only: 8.0
  noise_before_p1: 12.0   # noise window start, before the P pick
  noise_before_p2: 2.0     # noise window end, before the P pick
  min_snr: 2.0

  # --- Pre-filter applied before amplitude/noise measurement ---
  filter_freqmin: 1.0
  filter_freqmax: 20.0
  filter_corners: 4

  # --- Local peak-to-peak search ---
  max_p2p_timespan_s: 2.0

  # --- Distance / magnitude formula ---
  min_distance_km: 0.1    # floor for R_km, avoids log10(0) at zero offset
  ml_formula: "hutton_boore"

  # --- Event-level aggregation ---
  # A station magnitude only counts toward the event ML if status == OK,
  # A_WA_mm and ML_station are finite and positive, and (if enabled) its SNR
  # passed min_snr.
  use_snr_filter_for_event_ml: true

  # --- Resume behaviour ---
  # Rows already computed with status == OK are kept as-is on rerun. All
  # other statuses (FAIL*, SKIP*) are retried -- same convention as
  # pick.py's checkpoint: only successes are considered "done".
  overwrite: false

  # --- Diagnostic plots (quick QC scatter/histograms) ---
  plot_summary: true

  # --- Deliverable event/magnitude map (PyGMT) ---
  plot_map: true
  map_output_path: "/media/galih/MyBackUp 2024/Jatim_new/output/magnitud/summary/event_magnitude_map.png"

  # Optional independent catalogue overlay (e.g. ISC), plotted as stars.
  # null -> layer skipped. Expected columns: latitude, longitude, magnitude, depth_km.
  map_isc_csv: null

  # Region and cross-section index lines (A/B/C/D) are auto-derived from
  # the station + event bounding box (see derive_region()).
  map_region_padding_deg: 0.3   # margin added around the station+event bounding box

  # --- Basemap ---
  # 'coast'  (default): flat land/water fill from GMT's bundled coastline
  #           database -- fully offline, no GMT_DATA_SERVER access needed.
  # 'relief' : shaded topography via pygmt.datasets.load_earth_relief() --
  #           requires downloading an earth-relief tile on first use.
  map_basemap: "coast"
  map_land_fill: "gray92"
  map_coast_resolution: "h"   # GMT coastline resolution: f/h/i/l/c

  # --- Magnitude -> marker size (cm) ---
  map_size_min_cm: 0.20
  map_size_max_cm: 0.75
  map_ml_ref_min: 0.5   # ML value mapped to size_min_cm
  map_ml_ref_max: 3.0   # ML value mapped to size_max_cm

  # --- Fault traces: hand-digitised from the prior jatim_aus study, NOT
  # derivable from station geometry -- flagged here, disable with map_plot_faults.
  map_plot_faults: true
  map_fault_traces:
    - name: "Waru-Cepu Fault"
      color: "orange"
      lon: [111.220, 111.758, 112.099, 112.214, 112.680]
      lat: [-7.1994, -7.3248, -7.3805, -7.3213, -7.3283]
    - name: "Surabaya Fault"
      color: "red"
      lon: [112.538, 112.715]
      lat: [-7.2029, -7.2760]
    - name: "Pasuruan Fault"
      color: "yellow"
      lon: [112.97085, 113.09625]
      lat: [-7.65204, -7.713075]
    - name: "Probolinggo Fault"
      color: "brown"
      lon: [113.33787, 113.47080]
      lat: [-7.8744, -7.85269]

  # --- Reference well marker: external point of interest, not part of the
  # network -- disable with map_plot_well if it doesn't apply to a new dataset.
  map_plot_well: true
  map_well_name: "Well Dander-1"
  map_well_lon: 111.5018
  map_well_lat: -7.2413


# ------------------------------------------------------------
# Stage 6 -- scripts/focmech.py
# Focal mechanism determination with FocoNet (Song et al., 2026)
# ------------------------------------------------------------
focal_mechanism:
  enabled: true
  # --- Main paths ---
  # Use relocated_catalog.csv (which contains event_id) rather than hypocenter_relocated_summary.csv
  relocated_catalog_csv: "/media/galih/MyBackUp 2024/Jatim_new/output/relocation/relocated_catalog.csv"
  phases_csv: "/media/galih/MyBackUp 2024/Jatim_new/output/hypocenter_locator/csv/hypocenter_phases.csv"
  stations_file: "/media/galih/MyBackUp 2024/Jatim_new/stations.txt"
  waveform_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/preprocessing"
  output_folder: "/media/galih/MyBackUp 2024/Jatim_new/output/focal_mechanism"
  
  # --- FocoNet config ---
  variant: "O"
  device: "cpu"
  batch_size: 64
  # Path to the FocoNet weights. FocoNet architecture is native in focmech.py.
  # The default model checkpoint is saved within the repository
  checkpoint_path: "/media/galih/MyBackUp 2024/Jatim_new/config/vel_model/FocoNet_O.pth"


  # --- Bandpass and windows ---
  bandpass_polarity: [1.0, 10.0]
  noise_window: [-5.0, -2.0]
  p_amp_window: [-0.5, 2.0]
  pre_pick_s: 6.0
  post_pick_s: 4.0
  polarity_search_s: 0.3
  polarity_aic_window_s: 0.4
  polarity_min_confidence: 0.67
  polarity_min_snr_log10: 0.3
  min_polarities: 4
  depth_clip_km: [0.0, 100.0]

  # --- Plotting ---
  nodal_plane: 1
  cross_section_spacing_km: 10.0
  cross_section_n_lines: 3
  cross_section_band_km: 10.0

